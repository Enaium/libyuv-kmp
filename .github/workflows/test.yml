name: Test

"on":
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-macos:
    name: Test macOS (JVM + Apple + web)
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Configure JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup Emscripten
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$HOME/emsdk"
          "$HOME/emsdk/emsdk" install latest
          "$HOME/emsdk/emsdk" activate latest
          echo "EMSDK=$HOME/emsdk" >> "$GITHUB_ENV"

      - name: Run JVM, native and web tests
        run: >
          ./gradlew --no-daemon --stacktrace
          :libyuv-kmp:jvmTest
          :libyuv-kmp:macosArm64Test
          :libyuv-kmp:jsNodeTest
          :libyuv-kmp:wasmJsNodeTest

      - name: Compile the remaining Apple targets
        run: >
          ./gradlew --no-daemon --stacktrace
          :libyuv-kmp:compileKotlinMacosX64
          :libyuv-kmp:compileKotlinIosArm64
          :libyuv-kmp:compileKotlinIosX64
          :libyuv-kmp:compileKotlinIosSimulatorArm64
          :libyuv-kmp:compileKotlinTvosArm64
          :libyuv-kmp:compileKotlinTvosSimulatorArm64
          :libyuv-kmp:compileKotlinWatchosArm64
          :libyuv-kmp:compileKotlinWatchosSimulatorArm64
          :libyuv-kmp:compileKotlinWatchosDeviceArm64

      - name: Publish to Maven Local
        run: >
          ./gradlew --no-daemon --stacktrace
          :libyuv-kmp:publishToMavenLocal
          -x :libyuv-kmp:publishAndroidPublicationToMavenLocal
          -x :libyuv-kmp:publishLinuxX64PublicationToMavenLocal
          -x :libyuv-kmp:publishLinuxArm64PublicationToMavenLocal
          -x :libyuv-kmp:publishMingwX64PublicationToMavenLocal
          -x :libyuv-kmp:publishAndroidNativeArm64PublicationToMavenLocal
          -x :libyuv-kmp:publishAndroidNativeArm32PublicationToMavenLocal
          -x :libyuv-kmp:publishAndroidNativeX64PublicationToMavenLocal
          -x :libyuv-kmp:publishAndroidNativeX86PublicationToMavenLocal
          :jni-jvm-darwin-aarch64:publishToMavenLocal
          :jni-jvm-darwin-x86_64:publishToMavenLocal

      - name: Verify Maven Local artifacts
        run: |
          REPO="$HOME/.m2/repository/cn/enaium/libyuv"
          JVM_POM="$REPO/libyuv-kmp-jvm/1.0.0/libyuv-kmp-jvm-1.0.0.pom"
          JNI_JAR="$REPO/libyuv-kmp-jni-jvm-darwin-aarch64/1.0.0/libyuv-kmp-jni-jvm-darwin-aarch64-1.0.0.jar"
          test -f "$JVM_POM" || { echo "FAIL: JVM POM missing"; exit 1; }
          grep -q "libyuv-kmp-jni-jvm-darwin-aarch64" "$JVM_POM" || { echo "FAIL: JVM POM lacks JNI runtime dependency"; exit 1; }
          test -f "$JNI_JAR" || { echo "FAIL: darwin JNI jar missing"; exit 1; }
          unzip -l "$JNI_JAR" | grep -q "libyuv_jni.dylib" || { echo "FAIL: dylib missing from JNI jar"; exit 1; }
          test -n "$(find "$REPO" -name '*.klib' -print -quit)" || { echo "FAIL: no Apple/web klib published"; exit 1; }
          for artifact in \
            libyuv-kmp-jvm \
            libyuv-kmp-macosarm64 libyuv-kmp-macosx64 \
            libyuv-kmp-iosarm64 libyuv-kmp-iosx64 libyuv-kmp-iossimulatorarm64 \
            libyuv-kmp-tvosarm64 libyuv-kmp-tvossimulatorarm64 \
            libyuv-kmp-watchosarm64 libyuv-kmp-watchossimulatorarm64 libyuv-kmp-watchosdevicearm64 \
            libyuv-kmp-js libyuv-kmp-wasm-js; do
            if [ ! -d "$REPO/$artifact/1.0.0" ]; then
              echo "FAIL: missing Maven Local artifact $artifact"
              exit 1
            fi
          done
          echo "OK: Maven Local artifacts present; klibs=$(find "$REPO" -name '*.klib' | wc -l)"

  test-linux:
    name: Test Linux (JVM + Linux + cross + Android)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Configure JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install cross-compilers
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64

      - name: Install Android SDK components
        run: |
          SDKMANAGER="$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-37.0" "platforms;android-37.1" "ndk;27.0.12077973" >/dev/null

      - name: Run JVM, Linux, Android host and cross-target tests
        run: >
          ./gradlew --no-daemon --stacktrace
          :libyuv-kmp:jvmTest
          :libyuv-kmp:linuxX64Test
          :libyuv-kmp:testAndroidHostTest
          :libyuv-kmp:linkDebugTestMingwX64
          :libyuv-kmp:linkDebugTestLinuxArm64
          :libyuv-kmp:compileKotlinLinuxArm64
          :libyuv-kmp:compileKotlinAndroidNativeArm64
          --continue

      - name: Assemble the Android example
        run: ./gradlew --no-daemon --stacktrace :examples:codec:assembleDebug

      - name: Verify the JNI library per ABI
        run: |
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            lib="libyuv-kmp/build/jniLibs/$abi/libyuv_jni.so"
            echo "=== $abi: $lib ==="
            if [ ! -f "$lib" ]; then
              echo "FAIL: no JNI library for $abi"
              exit 1
            fi
            echo "OK: $(du -h "$lib" | cut -f1)"
          done

      - name: Verify the static archives
        run: |
          for target in linuxX64 linuxArm64 mingwX64 androidNativeArm64; do
            archive="libyuv-kmp/build/native/$target/libyuv_kmp.a"
            echo "=== $target: $archive ==="
            if [ ! -f "$archive" ]; then
              echo "FAIL: no static archive for $target"
              exit 1
            fi
            echo "OK: $(du -h "$archive" | cut -f1)"
          done

      - name: Publish to Maven Local
        run: >
          ./gradlew --no-daemon --stacktrace
          :libyuv-kmp:publishAndroidPublicationToMavenLocal
          :libyuv-kmp:publishLinuxX64PublicationToMavenLocal
          :libyuv-kmp:publishLinuxArm64PublicationToMavenLocal
          :libyuv-kmp:publishMingwX64PublicationToMavenLocal
          :libyuv-kmp:publishAndroidNativeArm64PublicationToMavenLocal
          :libyuv-kmp:publishAndroidNativeArm32PublicationToMavenLocal
          :libyuv-kmp:publishAndroidNativeX64PublicationToMavenLocal
          :libyuv-kmp:publishAndroidNativeX86PublicationToMavenLocal
          :jni-jvm-linux-x86_64:publishToMavenLocal
          :jni-jvm-linux-aarch64:publishToMavenLocal

      - name: Verify Maven Local artifacts
        run: |
          REPO="$HOME/.m2/repository/cn/enaium/libyuv"
          AAR=$(find "$REPO" -path "*libyuv-kmp-android/1.0.0/*.aar" -print -quit)
          test -n "$AAR" || { echo "FAIL: Android AAR missing"; exit 1; }
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            unzip -l "$AAR" | grep -q "jni/$abi/libyuv_jni.so" || {
              echo "FAIL: AAR lacks $abi JNI library"
              exit 1
            }
          done
          JNI_JAR=$(find "$REPO" -path "*libyuv-kmp-jni-jvm-linux-x86_64/1.0.0/*.jar" -print -quit)
          test -n "$JNI_JAR" || { echo "FAIL: linux JNI jar missing"; exit 1; }
          unzip -l "$JNI_JAR" | grep -q "libyuv_jni.so" || { echo "FAIL: .so missing from linux JNI jar"; exit 1; }
          test -n "$(find "$REPO" -name '*.klib' -print -quit)" || { echo "FAIL: no Linux/MinGW/AndroidNative klib published"; exit 1; }
          for artifact in \
            libyuv-kmp-android \
            libyuv-kmp-linuxx64 libyuv-kmp-linuxarm64 \
            libyuv-kmp-mingwx64 \
            libyuv-kmp-androidnativearm64 libyuv-kmp-androidnativearm32 \
            libyuv-kmp-androidnativex64 libyuv-kmp-androidnativex86; do
            if [ ! -d "$REPO/$artifact/1.0.0" ]; then
              echo "FAIL: missing Maven Local artifact $artifact"
              exit 1
            fi
          done
          echo "OK: Android AAR, Linux JNI and klibs present"

  test-windows:
    name: Test Windows (JVM + MinGW)
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Configure JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install MinGW
        shell: pwsh
        run: |
          choco install mingw -y --no-progress
          echo "C:\ProgramData\chocolatey\lib\mingw\tools\install\bin" |
            Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Run JVM and MinGW tests
        run: ./gradlew --no-daemon --stacktrace :libyuv-kmp:jvmTest :libyuv-kmp:mingwX64Test

      - name: Verify the Windows JNI library
        shell: pwsh
        run: |
          $dll = "jni/jvm/windows-x86_64/build/jni-native/windows-x86_64/yuv_jni.dll"
          if (!(Test-Path $dll)) { throw "Missing $dll" }
          Write-Output "OK: $((Get-Item $dll).Length) bytes"

      - name: Publish to Maven Local
        run: ./gradlew --no-daemon --stacktrace :jni-jvm-windows-x86_64:publishToMavenLocal

      - name: Verify Maven Local artifact
        shell: pwsh
        run: |
          $jar = Join-Path $env:USERPROFILE ".m2\repository\cn\enaium\libyuv\libyuv-kmp-jni-jvm-windows-x86_64\1.0.0\libyuv-kmp-jni-jvm-windows-x86_64-1.0.0.jar"
          if (!(Test-Path $jar)) { throw "Missing $jar" }
          $entries = & jar tf $jar
          if (-not ($entries -match "yuv_jni.dll")) { throw "yuv_jni.dll missing from $jar" }
          Write-Output "OK: Maven Local JNI jar contains yuv_jni.dll"
